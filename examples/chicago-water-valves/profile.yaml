# The exact search used for this example. Copy it under `searches:` in your own
# config/profile.yaml, with ideal_customer.md from this folder listed under `context:`.
# The OSHA file is public but not committed: download it from https://www.osha.gov/itadata.

context:
  - examples/chicago-water-valves/ideal_customer.md

searches:
  chicago_water_valves:
    label: "Water valve manufacturers (Chicago metro)"
    goal: market_map
    region:
      label: "Chicago metro (IL and NW Indiana)"
      countries: [US]
      regions: [IL, IN]
      postal_prefixes: ["600", "601", "602", "603", "604", "605", "606", "607", "608", "463", "464"]
      cities: ["Chicago", "Franklin Park", "Elmhurst", "Des Plaines", "Aurora", "Morton Grove", "Skokie",
               "Elk Grove Village", "Downers Grove", "Westmont", "Lincolnshire", "Broadview", "West Chicago",
               "Lake Villa", "Schaumburg", "Naperville", "Joliet", "Elgin", "Hammond", "Gary"]
      site_terms: ["Chicago", "Illinois", "Chicagoland"]
    prefer: small
    sources:
      - type: csv
        path: examples/chicago-water-valves/web-search-candidates.csv
        label: "Web search candidates (collected by agent)"
      - type: nsf
        programs: [PwsComponents, Plumbing]
      - type: osha_ita
        path: data/imports/osha/ITA_300A_Summary_Data_2024_through_12-31-2025.zip
        naics: ["332911", "332912", "332913", "332919"]
    include_any:
      - "valve"
    region_strict: true
    require_website: false   # OSHA filings carry no website
    enrich:
      max_sites: 80
      max_pages: 3
    judge:
      limit: 30
      drafts: false
    dedup: false
    buyers:
      years: 5
      sources:
        - type: usaspending
          naics: ["332911", "332913", "332919"]
          states: ["IL", "IN"]
          by_company: true
          max_awards: 100
        # City contracts via any Socrata open data portal. Not used in the published
        # example run: every Socrata portal refused connections from the network that
        # produced it. Uncomment to add Chicago's own purchasing to the picture.
        # - type: socrata
        #   label: "City of Chicago contracts"
        #   buyer: "City of Chicago"
        #   domain: data.cityofchicago.org
        #   dataset: rsxa-ify5
        #   fields: {vendor: vendor_name, unit: department, description: description,
        #            amount: award_amount, date: start_date, id: purchase_order_contract_number}
      keywords: ["valve", "hydrant", "backflow", "flushometer"]
